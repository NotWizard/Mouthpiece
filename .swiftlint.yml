# SwiftLint configuration for Mouthpiece (audit E6).
# Goal: zero errors on the existing codebase via configuration only;
# warnings are tolerated and should be burned down over time.

included:
  - Native

excluded:
  - .build
  - .build-cache
  - .worktrees
  - node_modules
  - resources
  - .qoder
  - docs
  - dist
  - artifacts
  - tmp
  - src
  - Native/Binaries
  - Native/Resources
  - Native/Packaging

disabled_rules:
  # Existing code intentionally keeps these patterns; re-enable incrementally.
  - todo
  - trailing_comma
  - opening_brace
  - trailing_whitespace

# Threshold-style rules: keep them as warnings only (raise error thresholds
# above the current worst offender so `swiftlint lint` reports zero errors).
line_length:
  warning: 200
  error: 500
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 1200
  error: 3000

type_body_length:
  warning: 800
  error: 2500

function_body_length:
  warning: 200
  error: 800

function_parameter_count:
  warning: 8
  error: 12

cyclomatic_complexity:
  warning: 25
  error: 60

nesting:
  type_level:
    warning: 3
    error: 6
  function_level:
    warning: 4
    error: 8

large_tuple:
  warning: 3
  error: 5

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 60
    error: 80
  validates_start_with_lowercase: warning

type_name:
  min_length:
    warning: 3
  max_length:
    warning: 60
    error: 80

force_cast: warning
force_try: warning

reporter: xcode
