name: Native macOS Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 2.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-15
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: release
        name: Validate release metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          scripts/validate-release-version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 on macOS 15
        if: matrix.runner == 'macos-15'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run native tests and replay benchmarks
        run: |
          xcodebuild -project Mouthpiece.xcodeproj -scheme Mouthpiece \
            -configuration Debug -derivedDataPath .build/release-tests test \
            CODE_SIGNING_ALLOWED=NO

  build:
    needs: [prepare, verify]
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: brew install xcodegen cmake

      - name: Import stable self-signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_SELFSIGN_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_SELFSIGN_CERT_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64" || { echo "Missing MAC_SELFSIGN_CERT_BASE64" >&2; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "Missing MAC_SELFSIGN_CERT_PASSWORD" >&2; exit 1; }
          CERTIFICATE_PATH="$RUNNER_TEMP/mouthpiece-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mouthpiece-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p runner "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p runner "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d ' "')
          # No System.keychain trust injection: signing only needs the identity
          # in the temp keychain, codesign --verify does not check trust, and
          # verify-native-artifact.sh explicitly tolerates the untrusted spctl
          # outcome. Trusting the cert system-wide polluted the shared runner.

      - name: Build, sign, and package ${{ matrix.arch }}
        env:
          MAC_SELFSIGN_IDENTITY: Mouthpiece Code Signing
          MAC_SELFSIGN_CERT_SHA1: DB4FFD2432826CB4DA396D12CD2B3193E51448D7
          MAC_SELFSIGN_CERT_SHA256: AD386695155758F30DEDDDCE3A88022E3A74D2B6B60CD368FD0994DE677BA04F
        run: scripts/build-native-release.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Mouthpiece-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mouthpiece-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/mouthpiece-signing.p12"

  publish:
    needs: [prepare, build]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "Missing SPARKLE_PRIVATE_KEY" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz" \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          SPARKLE_SHA256=ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c - || {
            echo "Sparkle archive checksum mismatch" >&2; exit 1;
          }
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          for ARCH in arm64 x64; do
            INPUT="$RUNNER_TEMP/appcast-input-$ARCH"
            mkdir -p "$INPUT"
            cp "release-assets/Mouthpiece-$VERSION-$ARCH-mac.zip" "$INPUT/"
            printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
              --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
              "$INPUT"
            cp "$INPUT"/appcast*.xml "release-assets/appcast-$ARCH.xml"
          done

      - name: Generate legacy electron-updater feed (one-time bridge to 2.0.0)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Old Mouthpiece 1.4.x (Electron) apps check for updates via electron-updater,
          # which fetches latest-mac.yml. The native 2.0.0 release uses Sparkle instead,
          # so this file is absent and old users hit a 404. Generate it once, pointing the
          # auto-update path at the native arm64 mac.zip (old Electron builds were arm64
          # only), so 1.4.x users auto-update to 2.0.0 and thereafter ride the Sparkle feed.
          ZIP="release-assets/Mouthpiece-$VERSION-arm64-mac.zip"
          DMG="release-assets/Mouthpiece-$VERSION-arm64.dmg"
          test -f "$ZIP" && test -f "$DMG"
          ZIP_SHA=$(shasum -a 512 "$ZIP" | awk '{print $1}')
          ZIP_SIZE=$(stat -f%z "$ZIP")
          DMG_SHA=$(shasum -a 512 "$DMG" | awk '{print $1}')
          DMG_SIZE=$(stat -f%z "$DMG")
          DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          cat > "release-assets/latest-mac.yml" <<YAML
          version: $VERSION
          files:
            - url: Mouthpiece-$VERSION-arm64-mac.zip
              sha512: $ZIP_SHA
              size: $ZIP_SIZE
            - url: Mouthpiece-$VERSION-arm64.dmg
              sha512: $DMG_SHA
              size: $DMG_SIZE
          path: Mouthpiece-$VERSION-arm64-mac.zip
          sha512: $ZIP_SHA
          releaseDate: '$DATE'
          YAML

      - name: Validate artifacts and release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "release-assets/Mouthpiece-$VERSION-arm64.dmg"
          test -f "release-assets/Mouthpiece-$VERSION-x64.dmg"
          test -f "release-assets/Mouthpiece-$VERSION-arm64-mac.zip"
          test -f "release-assets/Mouthpiece-$VERSION-x64-mac.zip"
          for ARCH in arm64 x64; do
            test -s "release-assets/appcast-$ARCH.xml"
            grep -q 'sparkle:edSignature=' "release-assets/appcast-$ARCH.xml"
            grep -q '15.0' "release-assets/appcast-$ARCH.xml"
          done
          test -f "docs/releases/v$VERSION.md"
          test -s "release-assets/latest-mac.yml"
          grep -q "version: $VERSION" "release-assets/latest-mac.yml"
          grep -q "path: Mouthpiece-$VERSION-arm64-mac.zip" "release-assets/latest-mac.yml"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          NOTES="docs/releases/v$VERSION.md"
          TITLE=$(sed -n '1s/^# //p' "$NOTES")
          test -n "$TITLE" || { echo "Release notes must start with '# Title' in $NOTES" >&2; exit 1; }
          tail -n +2 "$NOTES" > "$RUNNER_TEMP/release-body.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/release-body.md" --latest
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/release-body.md" --latest
          fi

      - name: Render Homebrew cask
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ARM_SHA=$(shasum -a 256 "release-assets/Mouthpiece-$VERSION-arm64.dmg" | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 "release-assets/Mouthpiece-$VERSION-x64.dmg" | awk '{print $1}')
          scripts/render-homebrew-cask.sh "$VERSION" "$ARM_SHA" "$INTEL_SHA" "$RUNNER_TEMP/mouthpiece.rb"
          ruby -c "$RUNNER_TEMP/mouthpiece.rb"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -n "$TAP_TOKEN" || { echo "Missing HOMEBREW_TAP_TOKEN or GH_TOKEN" >&2; exit 1; }
          git clone "https://x-access-token:$TAP_TOKEN@github.com/NotWizard/homebrew-mouthpiece.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp "$RUNNER_TEMP/mouthpiece.rb" "$RUNNER_TEMP/tap/Casks/mouthpiece.rb"
          cd "$RUNNER_TEMP/tap"
          if git diff --quiet -- Casks/mouthpiece.rb; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mouthpiece.rb
          git commit -F - <<MESSAGE
          更新 Mouthpiece Homebrew cask 至 $VERSION / Update Mouthpiece Homebrew cask to $VERSION

          中文
            概述：同步 Mouthpiece $VERSION 的 macOS 双架构安装包。
            变更：
              1. 更新 Apple Silicon 与 Intel 下载地址及 SHA-256。

          English
            Summary: Sync the macOS dual-architecture packages for Mouthpiece $VERSION.
            Changes:
              1. Update Apple Silicon and Intel download URLs and SHA-256 values.
          MESSAGE
          git push origin HEAD:main
