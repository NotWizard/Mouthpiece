name: Native macOS CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run native tests
        run: |
          xcodebuild -project Mouthpiece.xcodeproj -scheme Mouthpiece \
            -configuration Debug -derivedDataPath .build/xcode test

      - name: Verify scripts
        run: |
          bash -n scripts/*.sh
          scripts/validate-release-version.sh 2.0.0

  intel:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test and compile Intel target
        run: |
          xcodebuild -project Mouthpiece.xcodeproj -scheme Mouthpiece \
            -configuration Debug -derivedDataPath .build/xcode-intel test \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
          xcodebuild -project Mouthpiece.xcodeproj -scheme Mouthpiece \
            -configuration Release -destination 'generic/platform=macOS' build \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
